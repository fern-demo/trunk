    post:
      x-fern-examples:
        - request:
            repo:
              host: github.com
              owner: openai
              name: trunk-merge-queue
            pr:
              number: 128
            targetBranch: main
          response:
            body:
              id: a3f5c9d2-7b4e-4f1a-9c3e-2d8b6f7a9e12
              state: TESTING
              readiness:
                isReady: false
                unmetConditions:
                  - All required status checks must pass
                  - No merge conflicts
              stateChangedAt: '2024-04-20T14:45:00Z'
              priorityValue: 2.5
              priorityName: High
              usedDefaultPriorityName: Normal
              skipTheLine: false
