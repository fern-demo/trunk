paths:
  /updateQueue:
    post:
      x-fern-examples:
        - request:
            repo:
              host: github.com
              owner: openai
              name: trunk-merge-queue
            targetBranch: main
          response:
            body:
              name: main-queue
              branch: main
              state: RUNNING
              size: 5
              concurrency: 3
  /createQueue:
    post:
      x-fern-examples:
        - request:
            repo:
              host: github.com
              owner: trunkio
              name: trunk-merge-queue
            targetBranch: main
          response:
            body:
              name: trunk-merge-queue-main
              branch: main
              state: RUNNING
              size: 3
              concurrency: 2
  /getQueue:
    post:
      x-fern-examples:
        - request:
            repo:
              host: github.com
              owner: trunkio
              name: trunk-merge-queue
            targetBranch: main
          response:
            body:
              name: Main Branch Merge Queue
              branch: main
              state: RUNNING
              size: 5
              concurrency: 3
