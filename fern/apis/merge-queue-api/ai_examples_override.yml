              status: running
              testRuns:
                - name: Unit Tests
                  status: passed
                  url: https://ci.github.com/trunkio/merge-queue/runs/123456789
                - name: Integration Tests
                  status: running
                  url: https://ci.github.com/trunkio/merge-queue/runs/123456790
